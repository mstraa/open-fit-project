[workspace]
resolver = "2"
members = [
    "crates/ofit-core",
    "crates/ofit-ingest",
    "crates/ofit-analytics",
    "crates/ofit-plugins",
    "crates/ofit-db",
    "crates/ofit-api",
    "crates/ofit-mcp",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/openfit/open-fit"
# rmcp (the MCP server SDK) is edition 2024 → de-facto floor is rustc 1.85.
rust-version = "1.85"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
# web
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
# openapi
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
# db
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "chrono", "uuid", "macros", "migrate"] }
# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# fit parsing
fitparser = "0.9"
# gpx parsing (standard track spine; gpxtpx HR/cadence extensions parsed via quick-xml)
gpx = "0.10"
# zip (Zepp app-export folder arrives zipped)
zip = { version = "2", default-features = false, features = ["deflate"] }
# xml (tcx + gpx gpxtpx extensions)
quick-xml = "0.40"
# wasm plugin host
extism = "1"
# plugin manifests (TOML next to the .wasm; JSON also accepted via serde_json)
toml = "0.8"
# compile WAT text -> wasm bytes in-process (dev-only, no toolchain) for host tests
wat = "1"
# utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
# auth
argon2 = "0.5"
rand = "0.8"
# mcp server (Phase 8): official Rust SDK, streamable-HTTP server transport.
# Transitives (http 1.x, http-body 1.x, tower-service 0.3, bytes, tokio-util)
# all match the existing lock — rmcp does NOT pull axum or hyper.
rmcp = { version = "1.7", features = ["server", "macros", "schemars", "transport-streamable-http-server", "tower"] }
# tool parameter JSON-schemas (rmcp requires schemars 1.x, NOT 0.8)
schemars = "1.0"
# query-string building for the MCP→API self-dispatch (same crate axum uses to parse)
serde_urlencoded = "0.7"
# row-streaming for the read-only SQL tool (cap rows without materializing all)
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# internal crates
ofit-core = { path = "crates/ofit-core" }
ofit-db = { path = "crates/ofit-db" }
ofit-ingest = { path = "crates/ofit-ingest" }
ofit-analytics = { path = "crates/ofit-analytics" }
ofit-plugins = { path = "crates/ofit-plugins" }
ofit-mcp = { path = "crates/ofit-mcp" }

[profile.release]
opt-level = 3
lto = "thin"
