name: ci

# Fast feedback on every push to main and every PR: the Rust workspace compiles
# + tests, and the web app type-checks + builds. The Android APK has its own
# (heavier) workflow — see android.yml.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Rust — check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No Node here: build.rs drops a placeholder web/dist so the rust-embed
      # crate (src/static_assets.rs) compiles without a web build.
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace

  web:
    name: Web — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
