# Open Fit — "simple" tier (AGPL-3.0-or-later)
#
# Single ofit-api container backed by SQLite on a named volume.
# First run triggers the config wizard (set OFIT_TOKEN there or via .env).
#
#   docker compose -f docker/docker-compose.simple.yml up
#
# Build context is the repo root (..) so the Dockerfile sees the whole
# Cargo workspace.

name: openfit-simple

services:
  api:
    # Pull a published image from GHCR. Set OFIT_VERSION in .env to pin a
    # release (e.g. 0.3.0); defaults to :latest. `docker compose pull` fetches
    # it. The build: block is kept so `docker compose build` still works from
    # source for local development.
    image: ghcr.io/mstraa/ofit-api:${OFIT_VERSION:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      # SQLite file lives on the persistent volume mounted at /data.
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/ofit.db?mode=rwc}
      OFIT_TOKEN: ${OFIT_TOKEN:-}
      OFIT_BIND: 0.0.0.0:8087
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ofit-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  ofit-data:
