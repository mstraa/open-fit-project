[package]
name = "ofit-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ofit-api"
path = "src/main.rs"

[dependencies]
ofit-core.workspace = true
ofit-db.workspace = true
ofit-ingest.workspace = true
ofit-analytics.workspace = true
ofit-plugins.workspace = true
ofit-mcp.workspace = true
axum = { workspace = true, features = ["multipart"] }
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
argon2.workspace = true
rand.workspace = true
# Embed the built web SPA (../../web/dist) into the release binary so a single
# self-contained `ofit-api` serves both the API and the UI on one port — no
# nginx, no separate web bundle. Debug builds read web/dist from disk at runtime
# (so `npm run dev` / a fresh `vite build` is picked up without recompiling).
# `build.rs` guarantees the folder exists at compile time.
rust-embed = "8"
mime_guess = "2"
